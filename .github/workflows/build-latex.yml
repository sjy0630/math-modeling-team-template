name: Build LaTeX paper

on:
  workflow_dispatch:
  push:
    paths:
      - "paper/**/*.tex"
      - "paper/**/*.bib"
      - "paper/**/*.sty"
      - "paper/**/*.cls"
  pull_request:
    paths:
      - "paper/**/*.tex"
      - "paper/**/*.bib"
      - "paper/**/*.sty"
      - "paper/**/*.cls"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Compile paper
        uses: xu-cheng/latex-action@v4
        with:
          root_file: paper/main.tex
          work_in_root_file_dir: true
          latexmk_use_xelatex: true
      - name: Upload PDF
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: paper-pdf
          path: paper/main.pdf
          retention-days: 30
      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: latex-log
          path: paper/main.log
          if-no-files-found: ignore
