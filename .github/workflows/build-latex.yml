name: Build LaTeX paper

on:
  workflow_dispatch:
  push:
    paths:
      - "paper/**/*.tex"
      - "paper/**/*.bib"
      - "paper/**/*.sty"
      - "paper/**/*.cls"
  pull_request:
    paths:
      - "paper/**/*.tex"
      - "paper/**/*.bib"
      - "paper/**/*.sty"
      - "paper/**/*.cls"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Install TeX Live
        uses: zauguin/install-texlive@v4
        with:
          packages: |
            scheme-small
            collection-langchinese
            collection-latexrecommended
            latexmk
      - name: Compile paper
        working-directory: paper
        run: latexmk -xelatex -interaction=nonstopmode -halt-on-error -outdir=../dist main.tex
      - name: Upload PDF
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: paper-pdf
          path: dist/main.pdf
          retention-days: 30
      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: latex-log
          path: dist/main.log
          if-no-files-found: ignore
